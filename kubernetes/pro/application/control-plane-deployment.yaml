apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: control-plane
  name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  strategy: {}
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - env:
            - name: IS_PRO
              value: "true"
            - name: MqProvider
              value: Kafka
            - name: Kafka__Producer__bootstrap.servers
              value: kafka:9092
            - name: Kafka__Consumer__bootstrap.servers
              value: kafka:9092
            - name: MongoDb__ConnectionString
              value: mongodb://admin:password@mongodb:27017
            - name: MongoDb__Database
              value: featbit
            - name: Redis__Instances__0
              value: redis:6379
            # --- OpenTelemetry export (opt-in) ---------------------------------
            # Off by default. Enabling it starts exporting ~80 custom instruments,
            # which is an ingest-volume and cost decision rather than just a config
            # change. To enable:
            #   1. Deploy an OTLP collector reachable at the endpoint below.
            #   2. Set ENABLE_OPENTELEMETRY to "true".
            # See docs/observability/exporting.md.
            - name: ENABLE_OPENTELEMETRY
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: featbit-control-plane
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            # Required. The endpoint above is a gRPC port, and both the .NET
            # auto-instrumentation and the Serilog OTLP sink default to
            # http/protobuf — without this every signal is posted to a gRPC
            # listener and silently discarded.
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            # Optional. Left unset, the redaction salt is random per process, so a
            # hashed credential will not correlate across replicas or services. Set
            # the same value everywhere (ideally from a Secret) if you need that.
            # - name: Observability__RedactionSalt
            #   value: change_me
          image: featbit/featbit-control-plane:latest
          # NOTE: The control-plane consumes its trigger topic directly from the main broker
          # (kafka:9092) and produces downstream messages back to the same broker. The aggregate
          # broker (kafka-aggregate:9092) is used by eval-servers and other multi-DC consumers;
          # the control-plane trigger topic is intra-cluster only and does not need the aggregate.
          name: control-plane
          ports:
            - containerPort: 5200
          # Liveness answers "is this process still serving HTTP?" and nothing else. The endpoint is
          # mapped with Predicate = _ => false, so it evaluates ZERO health checks and cannot fail
          # because a datastore or a peer DC is unreachable. That is precisely what makes it safe to
          # restart on: a dependency outage must never restart pods, it must only take them out of
          # rotation — which is readiness' job, below.
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 5200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Readiness DOES evaluate the datastore, message-queue, and cache checks. Those
          # dependencies are shared, so an outage in one takes every replica out of rotation at
          # once rather than shifting traffic to a healthy pod — that is inherent to the dependency
          # being shared, not a probe defect. failureThreshold x periodSeconds gives a 30s
          # ride-through before that happens; raise failureThreshold if your datastore is prone to
          # brief stalls. Individual checks time out after 5s in code, which timeoutSeconds matches.
          #
          # Peer-DC reachability and leader state are deliberately NOT in readiness — they are
          # Diagnostics-tagged and surfaced only on /health/diagnostics. Putting them here would let
          # one DC's outage pull every control-plane pod in a healthy DC out of rotation, escalating
          # a single-DC failure into a total one.
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 5200
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
              ephemeral-storage: 2Gi
            limits:
              memory: 512Mi
              cpu: 1500m
              ephemeral-storage: 4Gi
      restartPolicy: Always
status: {}
