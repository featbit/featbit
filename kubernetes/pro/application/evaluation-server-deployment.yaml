apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: evaluation-server
  name: evaluation-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: evaluation-server
  strategy: {}
  template:
    metadata:
      labels:
        app: evaluation-server
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - env:
            - name: IS_PRO
              value: "true"
            - name: MqProvider
              value: Kafka
            - name: Kafka__Producer__bootstrap.servers
              value: kafka:9092
            - name: Kafka__Consumer__bootstrap.servers
              value: kafka-aggregate:9092
            - name: ControlPlane__Enabled
              value: "true"
            - name: MongoDb__ConnectionString
              value: mongodb://admin:password@mongodb:27017
            - name: MongoDb__Database
              value: featbit
            - name: Redis__ConnectionString
              value: redis:6379
            # --- OpenTelemetry export (opt-in) ---------------------------------
            # Off by default. Enabling it starts exporting ~80 custom instruments,
            # which is an ingest-volume and cost decision rather than just a config
            # change. To enable:
            #   1. Deploy an OTLP collector reachable at the endpoint below.
            #   2. Set ENABLE_OPENTELEMETRY to "true".
            # See docs/observability/exporting.md.
            - name: ENABLE_OPENTELEMETRY
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: featbit-els
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            # Required. The endpoint above is a gRPC port, and both the .NET
            # auto-instrumentation and the Serilog OTLP sink default to
            # http/protobuf — without this every signal is posted to a gRPC
            # listener and silently discarded.
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            # Optional. Left unset, the redaction salt is random per process, so a
            # hashed credential will not correlate across replicas or services. Set
            # the same value everywhere (ideally from a Secret) if you need that.
            # - name: Observability__RedactionSalt
            #   value: change_me
          image: featbit/featbit-evaluation-server:latest
          # NOTE: The Kafka and ControlPlane__Enabled settings below are overridden at
          # deploy time by Deploy-FeatBitClusters.ps1 based on the deployment mode:
          #   Advanced — Consumer points to kafka-aggregate:9092; ControlPlane__Enabled=true
          #   Basic    — Consumer points to kafka:9092; ControlPlane__Enabled=true
          name: evaluation-server
          ports:
            - containerPort: 5100
          # Liveness answers "is this process still serving HTTP?" and nothing else. The endpoint is
          # mapped with Predicate = _ => false, so it evaluates ZERO health checks and cannot fail
          # because Postgres, Kafka, or Redis is down. That is precisely what makes it safe to
          # restart on: a dependency outage must never restart pods, it must only take them out of
          # rotation — which is readiness' job, below.
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 5100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Readiness DOES evaluate the datastore, message-queue, and cache checks. This replaces a
          # tcpSocket check on 5100, which only proved the listener was bound and reported Ready
          # while the pod could not reach any of its dependencies. Those dependencies are shared, so
          # an outage in one takes every replica out of rotation at once rather than shifting
          # traffic to a healthy pod — inherent to the dependency being shared, not a probe defect.
          # failureThreshold x periodSeconds gives a 30s ride-through; raise failureThreshold if
          # your datastore is prone to brief stalls. Checks time out after 5s in code.
          #
          # Under ControlPlane__Enabled with GatedCommit, a stale heartbeat also fails readiness by
          # design, pulling the pod from rotation until heartbeats recover.
          #
          # Note for streaming: readiness gates only NEW connections arriving through the Service.
          # Established SDK WebSockets are unaffected by a pod going NotReady.
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 5100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: 
            requests:
              memory: 192Mi
              cpu: 50m
              ephemeral-storage: 2Gi
            limits:
              memory: 384Mi
              cpu: 1500m
              ephemeral-storage: 4Gi
      restartPolicy: Always
status: {}
