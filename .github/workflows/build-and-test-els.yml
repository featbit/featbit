name: Build and Test Evaluation-Server
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'modules/evaluation-server/**'
      - 'modules/Directory.Packages.props'
      - '.github/workflows/build-and-test-els.yml'
      - 'global.json'
  pull_request:
    branches:
      - main
    paths:
      - 'modules/evaluation-server/**'
      - 'modules/Directory.Packages.props'
      - '.github/workflows/build-and-test-els.yml'
      - 'global.json'

jobs:
  validate:
    name: build-and-test-els
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/evaluation-server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Packages
        run: dotnet restore

      - name: Build Solution
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        # Category=Integration tests require external Docker infrastructure (Mongo, Redis)
        # that CI does not provision; they are local-only.
        # A test project with only Integration tests then runs zero tests, which Microsoft.Testing.Platform
        # reports as exit code 8; --ignore-exit-code 8 treats that as success.
        run: dotnet test -c Release --no-build --verbosity normal --filter "Category!=Integration" --coverlet --coverlet-output-format cobertura --results-directory TestResults --ignore-exit-code 8

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evaluation-server
          path: modules/evaluation-server/TestResults/**/coverage.cobertura*.xml
          if-no-files-found: warn
