name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build (for example, 6.0.0 or 6.0.0-preview)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - name: Validate release source and reject existing image tags
        run: python3 .github/scripts/release_images.py preflight

  build-publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: featbit-ui
            context: modules/front-end
            file: modules/front-end/Dockerfile
          - app: featbit-api-server
            context: modules/back-end
            file: modules/back-end/deploy/Dockerfile
          - app: featbit-control-plane
            context: modules
            file: modules/control-plane/deploy/Dockerfile
          - app: featbit-evaluation-server
            context: modules/evaluation-server
            file: modules/evaluation-server/deploy/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - name: Validate source and reject overwrites on job retries
        env:
          APP: ${{ matrix.app }}
        run: python3 .github/scripts/release_images.py preflight-app
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push version image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: featbit/${{ matrix.app }}:${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Record and verify published digest
        env:
          APP: ${{ matrix.app }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 .github/scripts/release_images.py record
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.app }}
          path: release-images/*.json
          if-no-files-found: error
          retention-days: 90
