name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build (for example, 6.0.0 or 6.0.0-preview)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - name: Validate release source and reject existing image tags
        run: python3 .github/scripts/release_images.py preflight

  build-publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: featbit-ui
            context: modules/front-end
            file: modules/front-end/Dockerfile
          - app: featbit-api-server
            context: modules/back-end
            file: modules/back-end/deploy/Dockerfile
          - app: featbit-control-plane
            context: modules
            file: modules/control-plane/deploy/Dockerfile
          - app: featbit-evaluation-server
            context: modules/evaluation-server
            file: modules/evaluation-server/deploy/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - name: Validate source and reject overwrites on job retries
        env:
          APP: ${{ matrix.app }}
        run: python3 .github/scripts/release_images.py preflight-app
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push version image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: featbit/${{ matrix.app }}:${{ env.CANDIDATE_TAG }}
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Record and verify published digest
        env:
          APP: ${{ matrix.app }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 .github/scripts/release_images.py record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-image-${{ github.run_attempt }}-${{ matrix.app }}
          path: release-images/*.json
          if-no-files-found: error
          retention-days: 90

  test-candidates:
    needs: build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-image-${{ github.run_attempt }}-*
          merge-multiple: true
          path: release-images
      - name: Load exact candidate digests for testing
        run: python3 .github/scripts/release_images.py stage-candidates
      - uses: ./.github/actions/e2e-core
        with:
          image-version: ${{ env.CANDIDATE_TAG }}
      - name: Final cleanup
        if: always()
        working-directory: e2e/core
        run: node cli.mjs down --all
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: e2e/core/.runs/
          include-hidden-files: true
          if-no-files-found: warn

  finalize:
    needs: test-candidates
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-image-${{ github.run_attempt }}-*
          merge-multiple: true
          path: release-images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Publish tested digests as the release version
        run: python3 .github/scripts/release_images.py finalize
      - name: Preserve release digests for latest promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-verified
          path: release-images/*.json
          if-no-files-found: error
          retention-days: 90
