name: Build and Test Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'modules/front-end/**'
      - 'modules/back-end/**'
      - 'infra/postgresql/docker-entrypoint-initdb.d/**'
      - '.github/workflows/build-and-test-frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'modules/front-end/**'
      - 'modules/back-end/**'
      - 'infra/postgresql/docker-entrypoint-initdb.d/**'
      - '.github/workflows/build-and-test-frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modules/front-end

jobs:
  unit-tests:
    name: Frontend unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: modules/front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test -- --maxWorkers=2

  container-e2e:
    name: E2E with locally built API and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: modules/front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build local images and run container E2E tests
        run: npm run test:e2e:containers -- --workers=2 --forbid-only --reporter=list,html --trace=retain-on-failure

      - name: Upload E2E report, failure traces, and diagnostic logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-results
          path: |
            modules/front-end/playwright-report/
            modules/front-end/test-results/
            modules/front-end/logs/e2e-containers/
          if-no-files-found: ignore
          retention-days: 7
