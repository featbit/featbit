name: featbit-otel
services:
  ui:
    image: featbit/ui:dev
    container_name: ui
    build:
      context: ./modules/front-end
      dockerfile: ./Dockerfile
    environment:
      - API_URL=http://localhost:5000
      - DEMO_URL=http://localhost:5173
      - EVALUATION_URL=http://localhost:5100
      - BASE_HREF=/
    depends_on:
      - api-server
      - demo-dino-game-vue
    ports:
      - "8081:80"
    networks:
      - featbit-network

  api-server:
    image: featbit/api:dev
    container_name: api
    build:
      context: ./modules
      dockerfile: ./back-end/deploy/Dockerfile
    environment:
      - SSOEnabled=true
      - ENABLE_OPENTELEMETRY=true
      - OTEL_SERVICE_NAME=featbit-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      # Required. The endpoint above is the collector's gRPC port, and both the .NET
      # auto-instrumentation and the Serilog OTLP sink default to http/protobuf — so without this
      # every signal is posted to a gRPC listener and silently discarded.
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      # Custom spans are off by default; enable them all so this stack exercises them.
      - Observability__Traces__Categories=all
      # Identical across services so a hashed credential correlates across them.
      - Observability__RedactionSalt=local-verification-salt
      - DbProvider=MongoDb
      - MqProvider=Redis
      - CacheProvider=Redis
      - Jwt__Algorithm=HS256
      - Jwt__Key=please_change_me_to_a_secure_secret_key
    depends_on:
      - mongodb
      - redis
      - otel-collector
    ports:
      - "5000:5000"
    networks:
      - featbit-network

  evaluation-server:
    image: featbit/evaluation-server:dev
    container_name: evaluation-server
    build:
      context: ./modules
      dockerfile: ./evaluation-server/deploy/Dockerfile
    depends_on:
      - mongodb
      - redis
      - otel-collector
    environment:
      - ENABLE_OPENTELEMETRY=true
      - OTEL_SERVICE_NAME=featbit-els
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - Observability__Traces__Categories=all
      - Observability__RedactionSalt=local-verification-salt
      - DbProvider=MongoDb
      - MqProvider=Redis
      - CacheProvider=Redis
    ports:
      - "5100:5100"
    networks:
      - featbit-network

  # The collector this stack exports to. Swap OTEL_EXPORTER_OTLP_ENDPOINT above for your own
  # collector's address to send the same signals somewhere else — nothing about the services is
  # specific to this one.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: otel-collector
    restart: on-failure
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infra/otel/otel-collector-verify.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint — FeatBit's metrics appear here
      - "13133:13133" # health_check
    networks:
      - featbit-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: on-failure
    volumes:
      - ./infra/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - featbit-network

  mongodb:
    image: mongo:5.0.32
    container_name: mongodb
    restart: on-failure
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=featbit
    volumes:
      - mongodb:/data/db
      - ./infra/mongodb/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
    networks:
      - featbit-network

  redis:
    image: bitnamilegacy/redis:6.2.10
    container_name: redis
    restart: on-failure
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - featbit-network
    ports:
      - "6379:6379"
    volumes:
      - redis:/bitnami/redis/data

  demo-dino-game-vue:
    image: featbit/demo-dino-game-vue:latest
    container_name: demo-dino-game-vue
    networks:
      - featbit-network
    ports:
      - "5173:80"

networks:
  featbit-network:
    name: featbit-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.1.0.0/16

volumes:
  mongodb:
  redis:
